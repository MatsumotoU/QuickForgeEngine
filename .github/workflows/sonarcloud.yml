name: SonarCloud Analysis
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

env:
  SOLUTION_FILE_PATH: project/QuickForgeEngine.sln
  CONFIGURATION: Development
  BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory 

jobs:
  sonarcloud:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Install SonarCloud Scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v4

      - name: Add MSBuild to Path
        uses: microsoft/setup-msbuild@v2

      # 1. 開始を宣言
      - name: SonarCloud Begin
        run: |
          dotnet-sonarscanner begin /k:"MatsumotoU_QuickForgeEngin" /o:"matsumotou" `
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.cfamily.compile-commands="${{ env.BUILD_WRAPPER_OUT_DIR }}\compile_commands.json" `
          /d:sonar.cfamily.ignoreUnknownCompilerOptions=true
      # 2. ソリューションを作る
      - name: Run Premake
        shell: cmd
        working-directory: project
        run: premake5.bat

      # 3. ビルドする
      - name: Build with Wrapper
        shell: cmd 
        run: |
          build-wrapper-win-x86-64.exe --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} msbuild project\QuickForgeEngine.sln /t:Rebuild /p:Platform=x64 /p:Configuration=${{ env.CONFIGURATION }}

      # 4. 終了して送信
      - name: SonarCloud End
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
