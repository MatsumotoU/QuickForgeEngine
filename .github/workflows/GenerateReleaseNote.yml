name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          # v10 requires writer v9, while semantic-release-action@v4 currently uses writer v8.
          # Pin the compatible preset instead of allowing an incompatible major upgrade.
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
