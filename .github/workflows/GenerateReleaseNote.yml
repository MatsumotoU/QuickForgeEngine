name: Release

on:
  push:
    branches:
      - master

jobs:
  debug:
    name: Debug build
    uses: ./.github/workflows/DebugBuild.yml

  development:
    name: Development build
    uses: ./.github/workflows/DevelopmentBuild.yml

  release_build:
    name: Release build
    uses: ./.github/workflows/ReleaseBuild.yml

  release:
    name: Generate Release Notes
    needs: [debug, development, release_build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          # v10 requires writer v9, while semantic-release-action@v4 currently uses writer v8.
          # Pin the compatible preset instead of allowing an incompatible major upgrade.
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
